name: Bug report
description: Report a reproducible DiceLab defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DiceLab. Do not include secrets, private user data, or security exploit details here; use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: DiceLab version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Windows desktop
        - macOS desktop
        - Linux desktop
        - Web companion
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS/browser version
      placeholder: Windows 11 / Chrome 151 / Ubuntu 24.04 / macOS ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact dice expression when relevant.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add safe screenshots/logs if useful. Remove tokens, personal information, and unrelated data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain secrets or sensitive personal data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
