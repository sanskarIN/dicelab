name: Native runtime boundary

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-runtime-boundaries.mjs'
      - 'scripts/check-runtime-boundaries.test.mjs'
      - 'scripts/check-runtime-boundaries.integration.test.mjs'
      - '.github/workflows/runtime-boundary-audit.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-runtime-boundaries.mjs'
      - 'scripts/check-runtime-boundaries.test.mjs'
      - 'scripts/check-runtime-boundaries.integration.test.mjs'
      - '.github/workflows/runtime-boundary-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit native runtime boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Self-test runtime auditor
        run: node --test scripts/check-runtime-boundaries.test.mjs scripts/check-runtime-boundaries.integration.test.mjs

      - name: Audit committed production source
        run: node scripts/check-runtime-boundaries.mjs
