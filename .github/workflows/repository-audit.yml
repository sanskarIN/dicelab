name: Repository audit

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency-free repository invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret audit self-test
        run: npm run security:secrets:test
      - name: High-confidence secret audit
        run: npm run security:secrets
      - name: Documentation audit self-test
        run: npm run docs:check:test
      - name: Documentation links and anchors
        run: npm run docs:check
      - name: File inventory self-test
        run: npm run docs:inventory:test
      - name: Exhaustive tracked-file documentation
        run: npm run docs:inventory
      - name: Browser E2E infrastructure self-test
        run: npm run test:e2e:infra
      - name: PWA audit self-test
        run: npm run policy:pwa:test
      - name: PWA integrity
        run: npm run policy:pwa
      - name: Accessibility audit self-test
        run: npm run policy:accessibility:test
      - name: Accessibility contract
        run: npm run policy:accessibility
      - name: Version audit self-test
        run: npm run version:check:test
      - name: Version consistency
        run: npm run version:check
      - name: Release verifier self-test
        run: npm run release:verify:test
