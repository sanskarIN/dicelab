name: Dependency lockfiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/lockfiles.yml

permissions:
  contents: write

concurrency:
  group: dicelab-lockfiles
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Verify generated Cargo lockfile satisfies the manifest
        working-directory: src-tauri
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Verify generated application versions
        run: node scripts/check-version-sync.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit lockfiles when changed
        run: |
          git config user.name "sanskarIN"
          git config user.email "sanskarin@outlook.in"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "build: lock application dependencies"
          git pull --rebase origin main
          if git push origin HEAD:main; then
            echo "Lockfiles committed directly to main."
          else
            echo "Direct main push was rejected; publishing generated lockfiles to automation/lockfiles."
            git push --force origin HEAD:refs/heads/automation/lockfiles
          fi
