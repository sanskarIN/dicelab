name: Dependency lockfiles

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - package.json
      - package-lock.json
      - src/config/app.ts
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - .github/workflows/lockfiles.yml

permissions:
  contents: write

concurrency:
  group: dicelab-lockfiles-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Verify generated Cargo lockfile satisfies the manifest
        working-directory: src-tauri
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Verify generated application versions
        run: node scripts/check-version-sync.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit lockfiles when changed
        shell: bash
        run: |
          git config user.name "sanskarIN"
          git config user.email "sanskarin@outlook.in"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi

          git commit -m "build: lock application dependencies"
          branch="${GITHUB_REF_NAME}"
          git pull --rebase origin "$branch"

          if git push origin "HEAD:$branch"; then
            echo "Lockfiles committed directly to $branch."
            exit 0
          fi

          if [[ "$branch" == "main" ]]; then
            fallback="automation/lockfiles"
          else
            fallback="automation/lockfiles-${branch//\//-}"
          fi
          echo "Direct push was rejected; publishing generated lockfiles to $fallback."
          git push --force origin "HEAD:refs/heads/$fallback"
