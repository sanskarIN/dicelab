name: Repository policy boundaries

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/capabilities/**'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-capabilities*.mjs'
      - 'scripts/check-tauri-security*.mjs'
      - 'scripts/check-offline-csp*.mjs'
      - 'scripts/check-localized-formatting*.mjs'
      - 'scripts/check-runtime-boundaries*.mjs'
      - 'scripts/check-native-command-contract*.mjs'
      - 'scripts/check-lockfile-consistency*.mjs'
      - 'scripts/check-pwa*.mjs'
      - 'scripts/check-policy-boundaries*.mjs'
      - '.github/workflows/repository-policy-audit.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/capabilities/**'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-capabilities*.mjs'
      - 'scripts/check-tauri-security*.mjs'
      - 'scripts/check-offline-csp*.mjs'
      - 'scripts/check-localized-formatting*.mjs'
      - 'scripts/check-runtime-boundaries*.mjs'
      - 'scripts/check-native-command-contract*.mjs'
      - 'scripts/check-lockfile-consistency*.mjs'
      - 'scripts/check-pwa*.mjs'
      - 'scripts/check-policy-boundaries*.mjs'
      - '.github/workflows/repository-policy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Audit repository policy boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test policy auditors
        run: npm run policy:test

      - name: Audit repository policy boundaries
        run: npm run policy:all
