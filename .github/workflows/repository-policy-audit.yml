name: Repository policy boundaries

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/capabilities/**'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-capabilities*.mjs'
      - 'scripts/check-tauri-security*.mjs'
      - 'scripts/check-localized-formatting*.mjs'
      - 'scripts/check-runtime-boundaries*.mjs'
      - 'scripts/check-policy-boundaries*.mjs'
      - '.github/workflows/repository-policy-audit.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/capabilities/**'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-capabilities*.mjs'
      - 'scripts/check-tauri-security*.mjs'
      - 'scripts/check-localized-formatting*.mjs'
      - 'scripts/check-runtime-boundaries*.mjs'
      - 'scripts/check-policy-boundaries*.mjs'
      - '.github/workflows/repository-policy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Audit repository policy boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test policy auditors
        run: |
          node --test scripts/check-capabilities.test.mjs scripts/check-capabilities.integration.test.mjs
          node --test scripts/check-tauri-security.test.mjs scripts/check-tauri-security.integration.test.mjs
          node --test scripts/check-localized-formatting.test.mjs scripts/check-localized-formatting.integration.test.mjs
          node --test scripts/check-runtime-boundaries.test.mjs scripts/check-runtime-boundaries.integration.test.mjs
          node --test scripts/check-policy-boundaries.integration.test.mjs

      - name: Audit repository policy boundaries
        run: node scripts/check-policy-boundaries.mjs
