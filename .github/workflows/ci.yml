name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair release branch
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/accessibility-contract-20260821'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Refresh npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "build(deps): regenerate npm lockfile"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Normalize Prettier formatting
        run: |
          npm run format:write
          if ! git diff --quiet; then
            git add -A
            git commit -m "style: normalize repository formatting"
          fi
      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize Rust formatting
        working-directory: src-tauri
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git add -A
            git commit -m "style(rust): align with rustfmt 1.98"
          fi
      - name: Verify repaired branch
        run: |
          npm run format
          npm run build
          npm run test
          npm run policy:all
          npm audit --audit-level=high
          (cd src-tauri && cargo fmt --all -- --check)
          git diff --check
      - name: Push repaired commits
        run: git push origin HEAD:${{ github.head_ref }}

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Secret audit self-test
        run: npm run security:secrets:test
      - name: High-confidence secret audit
        run: npm run security:secrets
      - name: Browser E2E infrastructure self-test
        run: npm run test:e2e:infra
      - name: Version audit self-test
        run: npm run version:check:test
      - name: Version consistency
        run: npm run version:check
      - name: PWA audit self-test
        run: npm run policy:pwa:test
      - name: PWA integrity
        run: npm run policy:pwa
      - name: Accessibility audit self-test
        run: npm run policy:accessibility:test
      - name: Accessibility contract
        run: npm run policy:accessibility
      - name: Install dependencies
        run: npm ci
      - name: Documentation links
        run: npm run docs:check
      - name: Format check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Production web build
        run: npm run build
      - name: Real browser end-to-end smoke
        run: npm run test:e2e

  rust:
    name: Rust quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not available on this runner."
            exit 1
          fi
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK was found under $ANDROID_HOME/ndk."
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: npm run tauri:android:init -- --ci --skip-targets-install
      - name: Build Android ARM64 APK and AAB
        run: npm run tauri:android:build -- --ci --target aarch64

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust iOS simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize iOS project
        run: npm run tauri:ios:init -- --ci --skip-targets-install
      - name: Build iOS ARM64 simulator application
        run: npm run tauri:ios:build:ci
