name: Release builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  web:
    name: Web artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret audit self-test
        run: npm run security:secrets:test
      - name: High-confidence secret audit
        run: npm run security:secrets
      - name: Documentation audit self-tests
        run: npm run docs:check:test && npm run docs:inventory:test
      - name: Documentation integrity
        run: npm run docs:check && npm run docs:inventory
      - name: Repository policy self-tests
        run: npm run policy:test
      - name: Repository policy boundaries
        run: npm run policy:all
      - name: Browser E2E infrastructure self-test
        run: npm run test:e2e:infra
      - name: Version audit self-test
        run: npm run version:check:test
      - name: Version and tag consistency
        env:
          DICELAB_EXPECT_VERSION: ${{ github.ref_name }}
        run: npm run version:check
      - name: Release document identity
        env:
          DICELAB_EXPECT_VERSION: ${{ github.ref_name }}
        run: npm run version:release-docs
      - name: Release verifier self-test
        run: npm run release:verify:test
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Production web build
        run: npm run build
      - name: Real browser end-to-end smoke
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dicelab-web-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        shell: bash
        run: npm ci
      - name: Verify Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build desktop bundle
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: dicelab-${{ runner.os }}-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    name: Android release-validation artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not available on this runner."
            exit 1
          fi
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK was found under $ANDROID_HOME/ndk."
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: npm run tauri:android:init -- --ci --skip-targets-install
      - name: Build universal Android APK and AAB
        run: npm run tauri:android:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: dicelab-Android-unsigned-${{ github.ref_name }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    name: iOS unsigned archive
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust iOS device target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize iOS project
        run: npm run tauri:ios:init -- --ci --skip-targets-install
      - name: Build unsigned iOS device archive
        run: npm run tauri:ios:archive:ci
      - uses: actions/upload-artifact@v4
        with:
          name: dicelab-iOS-unsigned-archive-${{ github.ref_name }}
          path: src-tauri/gen/apple/build/*.xcarchive
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [web, desktop, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package release artifacts
        shell: bash
        env:
          DICELAB_TAG: ${{ github.ref_name }}
          DICELAB_SOURCE_COMMIT: ${{ github.sha }}
          DICELAB_REPOSITORY: ${{ github.repository }}
          DICELAB_WORKFLOW_RUN_ID: ${{ github.run_id }}
          DICELAB_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p release-packages
          for directory in release-artifacts/*; do
            [ -d "$directory" ] || continue
            name="$(basename "$directory")"
            (
              cd "$directory"
              zip -qr "../../release-packages/${name}.zip" .
            )
          done
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const manifest = {
            schemaVersion: 1,
            project: 'DiceLab',
            repository: process.env.DICELAB_REPOSITORY,
            tag: process.env.DICELAB_TAG,
            sourceCommit: process.env.DICELAB_SOURCE_COMMIT,
            workflowRunId: process.env.DICELAB_WORKFLOW_RUN_ID,
            workflowRunAttempt: process.env.DICELAB_WORKFLOW_RUN_ATTEMPT,
          };
          writeFileSync('release-packages/RELEASE-METADATA.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          (
            cd release-packages
            sha256sum ./*.zip RELEASE-METADATA.json > SHA256SUMS.txt
          )
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "DiceLab ${GITHUB_REF_NAME}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-packages/* --clobber
