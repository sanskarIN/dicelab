name: Tauri security policy

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-tauri-security.mjs'
      - 'scripts/check-tauri-security.test.mjs'
      - 'scripts/check-tauri-security.integration.test.mjs'
      - '.github/workflows/tauri-security-audit.yml'
  pull_request:
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'scripts/check-tauri-security.mjs'
      - 'scripts/check-tauri-security.test.mjs'
      - 'scripts/check-tauri-security.integration.test.mjs'
      - '.github/workflows/tauri-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-security-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Tauri security config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test Tauri security auditor
        run: node --test scripts/check-tauri-security.test.mjs scripts/check-tauri-security.integration.test.mjs

      - name: Audit committed Tauri security configuration
        run: node scripts/check-tauri-security.mjs
