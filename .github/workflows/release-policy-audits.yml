name: Release policy audits

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Verify repository policy boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test policy auditors
        run: npm run policy:test

      - name: Audit repository policy boundaries
        run: npm run policy:all
