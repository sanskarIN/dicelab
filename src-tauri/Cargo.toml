[package]
name = "dicelab"
version = "2.0.14"
description = "DiceLab cross-platform dice simulator"
authors = ["Sanskar <sanskarin@outlook.in>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sanskarIN/dicelab"

[lib]
name = "dicelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
fuzzing = []

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
rand = "0.8.5"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true